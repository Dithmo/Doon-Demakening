; Export presets, committed on purpose.
;
; Godot writes this file when you configure an export in the editor, and the
; default .gitignore for a Godot project excludes it -- which is why there was
; never a downloadable build. Excluding it means the recipe for turning the
; repository into a game lives on one person's machine, so nobody else can make
; one and CI cannot either.
;
; include_filter is the part that matters here and the part that is easy to get
; wrong. Godot exports *imported resources*; the region data is raw binary
; (.r16 heightmaps, .u8 masks) and the item/recipe/structure catalogues are
; plain JSON, none of which the importer knows about. Without naming them here
; they are silently left out and the exported game starts with no terrain and
; no items -- an export that succeeds and produces something broken.

[preset.0]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json, *.r16, *.u8, *.cfg"
exclude_filter="data/wiki/*, .test_home*/*, tools/*, tests/*"
export_path="build/doon.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false

